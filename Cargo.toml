[package]
name = "buhttery"
version = "1.2.0"
edition = "2021"

[[bin]]
name = "buhttery"
path = "src/main.rs"

[build-dependencies]
winres = "0.1"

[dependencies]
tray-icon = "0.24"
hidapi = "2"
winreg = "0.55"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
