name: build n release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  discussions: write
  pull-requests: write
  issues: write
  statuses: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: do py
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: do deps
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: build exe
      run: |
        pyinstaller --onefile --windowed --icon=assets/100.ico --add-data "assets;assets" --hidden-import=pystray --hidden-import=PIL --hidden-import=hid --name "hyperx-cloud3s-battery-tray" main.py
    
    - name: make release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/hyperx-cloud3s-battery-tray.exe
        body: |        
          HyperX Cloud 3s Battery Tray ${{ github.ref_name }}
        token: ${{ secrets.GITHUB_TOKEN }}